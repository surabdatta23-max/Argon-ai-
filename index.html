    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGON AI – Your Life. Your Assistant. Your Intelligence.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        argon: {
                            base: '#05070e',
                            surface: '#0a0e1c',
                            card: '#0f152a',
                            border: 'rgba(255, 255, 255, 0.08)',
                            cyan: '#06b6d4',
                            magenta: '#ec4899',
                            purple: '#a855f7',
                            emerald: '#10b981',
                            amber: '#f59e0b',
                            rose: '#f43f5e'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'orb-idle': 'orbIdle 4s ease-in-out infinite',
                        'radar-ring': 'radarExpand 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite',
                        'spin-fast': 'spin 1.8s linear infinite',
                        'wake-burst': 'wakeBurst 0.9s cubic-bezier(0.1, 0.9, 0.2, 1) forwards'
                    },
                    keyframes: {
                        orbIdle: {
                            '0%, 100%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 20px rgba(6,182,212,0.35))' },
                            '50%': { transform: 'scale(1.04)', filter: 'drop-shadow(0 0 38px rgba(168,85,247,0.65))' }
                        },
                        radarExpand: {
                            '0%': { transform: 'scale(0.85)', opacity: '0.9' },
                            '100%': { transform: 'scale(1.75)', opacity: '0' }
                        },
                        wakeBurst: {
                            '0%': { transform: 'scale(0.75)', filter: 'brightness(2) drop-shadow(0 0 50px #ec4899)' },
                            '50%': { transform: 'scale(1.15)', filter: 'brightness(1.5) drop-shadow(0 0 70px #06b6d4)' },
                            '100%': { transform: 'scale(1)', filter: 'brightness(1) drop-shadow(0 0 35px #a855f7)' }
                        }
                    }
                }
            }
        }
    </script>
